name: paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Source manifest
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
      - name: Install Tectonic and poppler
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          tectonic --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build and check the manuscript
        working-directory: paper
        run: |
          set -euo pipefail -x
          tectonic --keep-logs main.tex
          if grep -nE 'Overfull|Underfull|Undefined|Warning|Citation.*undefined|There were' main.log; then exit 1; fi
          test -s main.pdf
          pdfinfo main.pdf > pdfinfo.txt
          grep -Eq '^Pages:[[:space:]]+6$' pdfinfo.txt
          pdfinfo -url main.pdf > urls.txt
          grep -qF 'https://github.com/SuperMatics-Inc/phonon-pairing-ceiling-map' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24406996' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24384461' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24384373' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24385569' urls.txt
          pdftotext -layout main.pdf paper-text.txt
          if grep -niE '---|awaits review|patentability|confirmed material|synthesi[sz]ed|\bpriority\b|world[- ]first' paper-text.txt; then exit 1; fi
          if grep -nE '\b(PROVED|CERTIFIED|NUMERICAL|INFERENCE|OPEN)\b' paper-text.txt; then exit 1; fi
          if grep -nE 'LINEAR[0-9]+(-[0-9]+)?|STAGE[0-9A-Z_-]*|HUBHOL|EXTHOL|R7|OPTIMUM|SSHBOUND|SHARPFLAT|UNIV-GLUE|CAPSTONE' paper-text.txt; then exit 1; fi
          grep -qF 'Davis Rens' paper-text.txt
          grep -qF 'SuperMatics Inc.' paper-text.txt
          grep -qF 'ORCID 0000-0001-5839-5197' paper-text.txt
          paper_flat="$(tr '\n' ' ' < paper-text.txt)"
          printf '%s\n' "$paper_flat" | grep -qF 'AI agents generated the proofs, code and drafts under D. Rens'
          printf '%s\n' "$paper_flat" | grep -qF 'separate AI agents did the independent reviews.'
          grep -qF 'This preprint has not been peer reviewed.' main.tex
          grep -qF 'This preprint has not been peer reviewed.' ../README.md
      - uses: actions/upload-artifact@v4
        with:
          name: phonon-pairing-ceiling-map-paper
          path: |
            paper/main.pdf
            paper/main.log
            paper/main.tex
            paper/refs.bib
            paper/urls.txt
            paper/pdfinfo.txt
            paper/paper-text.txt
          if-no-files-found: error
